<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Live Poll</title>
<style>
  :root {
    --bg:     #0f1117;
    --surface:#1a1d27;
    --border: #2e3347;
    --text:   #e8ecf4;
    --muted:  #8892a4;
    --radius: 14px;
  }

  /* Per-option accent colors */
  --c0: #29b5e8; --c1: #56d483; --c2: #e8a229;
  --c3: #9b59b6; --c4: #e85d4a; --c5: #1abc9c;

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  .header {
    padding: 20px 20px 0;
    text-align: center;
  }
  .header .logo {
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 0.14em;
    color: #29b5e8;
    text-transform: uppercase;
    margin-bottom: 4px;
  }

  .main {
    flex: 1;
    padding: 16px 20px 24px;
    display: flex;
    flex-direction: column;
  }

  /* States */
  .state { display: none; flex-direction: column; flex: 1; }
  .state.active { display: flex; }

  /* Loading state */
  #state-loading { align-items: center; justify-content: center; }
  .spinner {
    width: 36px; height: 36px;
    border: 3px solid var(--border);
    border-top-color: #29b5e8;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* No question state */
  #state-empty { align-items: center; justify-content: center; text-align: center; }
  #state-empty .icon { font-size: 3rem; margin-bottom: 16px; }
  #state-empty p { color: var(--muted); font-size: 0.95rem; }

  /* Vote state */
  #state-vote { justify-content: flex-start; }

  .question-text {
    font-size: 1.25rem;
    font-weight: 700;
    line-height: 1.45;
    margin-bottom: 8px;
  }
  .question-context {
    font-size: 0.9rem;
    color: var(--muted);
    margin-bottom: 24px;
    line-height: 1.5;
  }

  .options-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
    flex: 1;
  }

  .option-btn {
    width: 100%;
    min-height: 60px;
    border: 2px solid var(--border);
    border-radius: var(--radius);
    background: var(--surface);
    color: var(--text);
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    padding: 14px 16px;
    gap: 14px;
    text-align: left;
    transition: border-color 0.15s, background 0.15s, transform 0.08s;
    -webkit-user-select: none;
    user-select: none;
  }
  .option-btn:active { transform: scale(0.97); }
  .option-btn.selected {
    background: color-mix(in srgb, var(--opt-color) 18%, var(--surface));
    border-color: var(--opt-color);
  }
  .option-btn:disabled { cursor: default; }

  .option-badge {
    width: 30px; height: 30px;
    border-radius: 50%;
    background: var(--opt-color);
    color: #0f1117;
    font-size: 0.8rem;
    font-weight: 800;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .option-label { flex: 1; }

  /* Voted state */
  #state-voted { justify-content: flex-start; }

  .voted-question {
    font-size: 1.15rem;
    font-weight: 700;
    margin-bottom: 20px;
    line-height: 1.45;
  }

  .result-row { margin-bottom: 14px; }
  .result-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 6px;
  }
  .result-badge {
    width: 26px; height: 26px;
    border-radius: 50%;
    font-size: 0.75rem;
    font-weight: 800;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    color: #0f1117;
  }
  .result-label { flex: 1; font-weight: 500; font-size: 0.95rem; }
  .result-pct {
    font-size: 0.95rem;
    font-weight: 700;
    min-width: 46px;
    text-align: right;
  }
  .result-count {
    font-size: 0.8rem;
    color: var(--muted);
    min-width: 60px;
    text-align: right;
  }

  .bar-track {
    height: 10px;
    background: var(--border);
    border-radius: 5px;
    overflow: hidden;
  }
  .bar-fill {
    height: 100%;
    border-radius: 5px;
    transition: width 0.45s cubic-bezier(.4,0,.2,1);
  }

  .my-vote-label {
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    color: var(--muted);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 1px 5px;
    margin-left: 6px;
    text-transform: uppercase;
  }

  /* Footer meta */
  .footer-meta {
    margin-top: 20px;
    display: flex;
    gap: 16px;
    font-size: 0.8rem;
    color: var(--muted);
    flex-wrap: wrap;
  }
  .footer-meta span strong { color: var(--text); }

  /* Color vars per option index */
  .opt-0 { --opt-color: #29b5e8; }
  .opt-1 { --opt-color: #56d483; }
  .opt-2 { --opt-color: #e8a229; }
  .opt-3 { --opt-color: #9b59b6; }
  .opt-4 { --opt-color: #e85d4a; }
  .opt-5 { --opt-color: #1abc9c; }
</style>
</head>
<body>

<div class="header">
  <div class="logo">Live Poll · Powered by Snowflake</div>
</div>

<div class="main">

  <!-- Loading -->
  <div class="state active" id="state-loading">
    <div class="spinner"></div>
  </div>

  <!-- No active question -->
  <div class="state" id="state-empty">
    <div class="icon">📭</div>
    <p>No active question right now.<br>Check back in a moment.</p>
  </div>

  <!-- Voting -->
  <div class="state" id="state-vote">
    <div class="question-text" id="q-text"></div>
    <div class="question-context" id="q-context"></div>
    <div class="options-list" id="options-list"></div>
  </div>

  <!-- Voted / results -->
  <div class="state" id="state-voted">
    <div class="voted-question" id="voted-q-text"></div>
    <div id="results-list"></div>
    <div class="footer-meta" id="footer-meta"></div>
  </div>

</div>

<script>
// ---------------------------------------------------------------------------
// State
// ---------------------------------------------------------------------------
const SESSION_KEY = 'demo_poll_session';
const VOTE_KEY    = 'demo_poll_vote'; // { question_id, option_id }

let sessionId = localStorage.getItem(SESSION_KEY);
if (!sessionId) {
  sessionId = crypto.randomUUID();
  localStorage.setItem(SESSION_KEY, sessionId);
}

let currentQuestionId = null;
let myVoteOptionId    = null;
let pollInterval      = null;

// ---------------------------------------------------------------------------
// Helpers
// ---------------------------------------------------------------------------
function esc(s) {
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function isMobile() {
  return /Mobi|Android/i.test(navigator.userAgent) ? 'mobile' : 'desktop';
}

function showState(id) {
  document.querySelectorAll('.state').forEach(el => el.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

// ---------------------------------------------------------------------------
// Load active question
// ---------------------------------------------------------------------------
async function loadQuestion() {
  try {
    const resp = await fetch('/api/active');
    const data = await resp.json();

    if (!data.active) {
      showState('state-empty');
      clearInterval(pollInterval);
      pollInterval = setInterval(loadQuestion, 4000);
      return;
    }

    // Check if already voted on this question
    const savedVote = JSON.parse(localStorage.getItem(VOTE_KEY) || 'null');
    if (savedVote && savedVote.question_id === data.question_id) {
      currentQuestionId = data.question_id;
      myVoteOptionId    = savedVote.option_id;
      showState('state-voted');
      clearInterval(pollInterval);
      document.getElementById('voted-q-text').textContent = data.question_text;
      pollInterval = setInterval(refreshResults, 2000);
      refreshResults();
      return;
    }

    // New question — show voting UI
    currentQuestionId = data.question_id;
    myVoteOptionId    = null;

    document.getElementById('q-text').textContent = data.question_text;
    const ctx = document.getElementById('q-context');
    ctx.textContent = data.context_text || '';
    ctx.style.display = data.context_text ? 'block' : 'none';

    const list = document.getElementById('options-list');
    list.innerHTML = '';
    (data.options || []).sort((a,b) => a.display_order - b.display_order).forEach((opt, i) => {
      const btn = document.createElement('button');
      btn.className = `option-btn opt-${i}`;
      btn.dataset.optionId = opt.option_id;
      btn.innerHTML = `
        <span class="option-badge">${String.fromCharCode(65+i)}</span>
        <span class="option-label">${esc(opt.option_text)}</span>`;
      btn.addEventListener('click', () => castVote(opt.option_id));
      list.appendChild(btn);
    });

    showState('state-vote');
    clearInterval(pollInterval);
    // Poll every 4s to detect if question changes
    pollInterval = setInterval(loadQuestion, 4000);

  } catch (e) {
    console.error('loadQuestion error:', e);
    showState('state-empty');
  }
}

// ---------------------------------------------------------------------------
// Cast a vote
// ---------------------------------------------------------------------------
async function castVote(optionId) {
  // Immediately disable all buttons to prevent double-tap
  document.querySelectorAll('.option-btn').forEach(b => {
    b.disabled = true;
    if (b.dataset.optionId === optionId) b.classList.add('selected');
  });

  try {
    const resp = await fetch('/api/predict', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        question_id: currentQuestionId,
        option_id:   optionId,
        session_id:  sessionId,
        platform:    isMobile(),
      })
    });

    if (resp.ok || resp.status === 409) {
      // Save vote locally
      localStorage.setItem(VOTE_KEY, JSON.stringify({
        question_id: currentQuestionId,
        option_id:   optionId,
      }));
      myVoteOptionId = optionId;

      // Transition to voted state
      document.getElementById('voted-q-text').textContent =
        document.getElementById('q-text').textContent;

      showState('state-voted');
      clearInterval(pollInterval);
      pollInterval = setInterval(refreshResults, 2000);
      refreshResults();
    } else {
      // Re-enable buttons on error
      document.querySelectorAll('.option-btn').forEach(b => {
        b.disabled = false;
        b.classList.remove('selected');
      });
    }
  } catch (e) {
    console.error('castVote error:', e);
    document.querySelectorAll('.option-btn').forEach(b => {
      b.disabled = false;
      b.classList.remove('selected');
    });
  }
}

// ---------------------------------------------------------------------------
// Refresh results (after voting)
// ---------------------------------------------------------------------------
async function refreshResults() {
  try {
    const resp  = await fetch('/api/results');
    const data  = await resp.json();

    if (!data.active || data.question_id !== currentQuestionId) {
      // Question changed — reload
      clearInterval(pollInterval);
      localStorage.removeItem(VOTE_KEY);
      loadQuestion();
      return;
    }

    const list = document.getElementById('results-list');
    list.innerHTML = '';
    (data.options || []).sort((a,b) => a.display_order - b.display_order).forEach((opt, i) => {
      const isMyVote = opt.option_id === myVoteOptionId;
      const myLabel  = isMyVote ? '<span class="my-vote-label">your vote</span>' : '';
      list.innerHTML += `
        <div class="result-row">
          <div class="result-header">
            <span class="result-badge opt-${i}" style="background:var(--opt-color)">${String.fromCharCode(65+i)}</span>
            <span class="result-label opt-${i}">${esc(opt.option_text)}${myLabel}</span>
            <span class="result-pct opt-${i}" style="color:var(--opt-color)">${opt.vote_pct}%</span>
            <span class="result-count">${opt.vote_count}</span>
          </div>
          <div class="bar-track">
            <div class="bar-fill opt-${i}" style="background:var(--opt-color);width:${opt.vote_pct}%"></div>
          </div>
        </div>`;
    });

    // Footer meta
    const meta = document.getElementById('footer-meta');
    const freshStr = data.freshness_ms != null ? `<span>Freshness <strong>${data.freshness_ms}ms</strong></span>` : '';
    meta.innerHTML = `
      <span>Total <strong>${data.total_votes}</strong> votes</span>
      <span>Rate <strong>${data.votes_per_sec}/s</strong></span>
      ${freshStr}`;

  } catch (e) {
    console.error('refreshResults error:', e);
  }
}

// ---------------------------------------------------------------------------
// Boot
// ---------------------------------------------------------------------------
loadQuestion();
</script>
</body>
</html>
